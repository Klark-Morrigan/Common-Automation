# Lint YAML across the three complementary surfaces this repo defines.
#
# Everything runs as sequential steps of a single `yaml` job, not as
# three separate jobs. Two reasons:
#   - One PR check entry instead of three. GitHub surfaces one status
#     check per job (`ci-yaml / <job>`), so collapsing to a single job
#     collapses the PR-check list to a single `ci-yaml / yaml` row.
#   - Fail fast for free. A step carries an implicit `success()` guard,
#     so the first failing step skips every step after it - the heavier
#     checks never run once a lighter one has failed. Steps also share
#     one checkout instead of paying for one per job.
#
# Steps are ordered cheapest-first across three complementary surfaces
# that the tools cover rather than overlap; each step's own comment
# states what it catches and why it sits where it does in the order.
#
# Each composite auto-skips when its target surface is absent, which is
# what lets a single reusable workflow serve every consumer regardless of
# which YAML surfaces they actually use. Other repos call it with no
# inputs:
#
#   jobs:
#     ci-yaml:
#       uses: Klark-Morrigan/Common-Automation/.github/workflows/ci-yaml.yml@master
#
# The staged checkout, runner selection, token scope, timeout and
# concurrency follow the shape README.md's "How the reusable workflows
# are built" section explains for every ci-* workflow.

name: ci-yaml

on:
  pull_request:
  # Manual runs let a maintainer override the runner for a one-off; this
  # is the only override path for this repo's own runs, since
  # pull_request cannot carry inputs.
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Optional runs-on override for this run, as a JSON label array
          (e.g. `["ubuntu-latest"]` or `["self-hosted","linux"]`). Takes
          precedence over the CI_YAML_RUNNER variable.
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      runner:
        description: >-
          Optional runs-on override, as a JSON label array (e.g.
          `["ubuntu-latest"]`). Takes precedence over the CI_YAML_RUNNER
          variable; consumers pass it in `with:` to override per-call.
          Leave empty to use the variable.
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Named literally, since github.workflow here is the caller's name, which
# the callers of every ci-* workflow share.
concurrency:
  group: ci-yaml-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  yaml:
    # The `runner` input, else the caller's CI_YAML_RUNNER variable, else
    # the hosted default; each a JSON label array.
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner)
      || vars.CI_YAML_RUNNER != '' && fromJSON(vars.CI_YAML_RUNNER)
      || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Check out caller repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Stage Common-Automation composites
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: Klark-Morrigan/Common-Automation
          ref: ${{ github.repository == 'Klark-Morrigan/Common-Automation' && github.sha || 'master' }}
          path: .common-automation
          sparse-checkout: |
            .github/actions
            .github/lib
          sparse-checkout-cone-mode: false

      # yamllint - runs first: valid YAML is the precondition for the
      # semantic checks below, so it gates them. Catches plain-YAML
      # style/syntax issues (trailing space, duplicate keys,
      # indentation) on everything outside the actionlint /
      # action-validator surface (Ansible, dependabot, mkdocs, ...).
      - name: yamllint
        uses: ./.common-automation/.github/actions/yamllint

      # actionlint - semantic workflow problems (expression typos,
      # missing run/uses, shell-script issues inside `run:` blocks).
      - name: actionlint
        uses: ./.common-automation/.github/actions/actionlint

      # action-validator - schema-level shape problems on BOTH
      # workflows AND composite action.yml files.
      - name: action-validator
        uses: ./.common-automation/.github/actions/action-validator
