name: Run bats suites
description: >
  Installs bats-core and runs every *.bats suite under a given path.
  Pass scan-path to point it at the directory you want covered;
  default is the repo root, so callers with .bats suites scattered
  across the repo can use the action with no inputs at all. Missing
  path / zero suites exits 0 silently (bats's own behaviour).

  Used by Common-Automation's own ci-bash.yml; also intended as a public
  building block for consumers that want the same bats invocation
  without re-deriving the install step.

  Targets Linux runners. ci-bash.yml, its only consumer, runs on
  ubuntu-latest (or a linux self-hosted runner); the baked-library
  detection below is written against the Linux library path (/usr/lib)
  and the sudo install path it exists to avoid. macOS / Windows runners
  are out of scope.

inputs:
  scan-path:
    description: Directory (relative to the repo root) to recurse for *.bats files.
    required: false
    default: '.'
  bats-version:
    description: >
      Override bats-core version. Empty (default) falls back to
      .github/lib/versions.env so the canonical version stays
      single-sourced across this action, ci-bash.yml, and
      scripts/_run-tests-bash.sh.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - id: resolve-version
      shell: bash
      # Empty bats-version means "use the canonical version". The
      # getter next to versions.env implements override-or-canonical.
      # ${{ github.action_path }} is this action's own checked-out dir
      # (.github/actions/test-bats); ../../lib reaches the shared-helper
      # dir where get-bats-version.sh and versions.env live - resolves
      # correctly in both local and cross-repo consumption.
      run: |
        version="$('${{ github.action_path }}/../../lib/get-bats-version.sh' '${{ inputs.bats-version }}')"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
    - id: detect-libs
      shell: bash
      # Decide, per helper library, whether bats-action should install it.
      # bats-action installs the libraries into /usr/lib using sudo. The probe
      # skips an install (install=false) when the library is already present
      # on the runner, and - crucially - when the runner cannot sudo without a
      # password: there the install could only fail with "a password is
      # required", so every install is skipped and the run relies on whatever
      # is baked. On a runner with passwordless sudo (e.g. GitHub-hosted) a
      # missing library installs as normal.
      #
      # The probe (and the library set it covers) lives in the shared
      # detect-baked-bats-libs.sh so it is shellcheck'd and unit-tested,
      # rather than as untested inline bash; its "<lib>_install=..." lines
      # feed the *-install inputs below.
      run: |
        '${{ github.action_path }}/../../lib/detect-baked-bats-libs.sh' >> "$GITHUB_OUTPUT"
    - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
      with:
        bats-version: ${{ steps.resolve-version.outputs.version }}
        # 4.0.0 stopped auto-passing the CI token; the install steps
        # hit the GitHub API to download bats and would otherwise fall
        # back to anonymous (60 req/hr, shared across runner IPs).
        # Restore the prior 3.0.1 behaviour to avoid rate-limit flakes.
        github-token: ${{ github.token }}
        # Per-library install flags from detect-libs above: a library is
        # skipped when already baked, or when the runner cannot sudo. The bats
        # binary itself installs into $HOME with no sudo, so it is never gated.
        support-install: ${{ steps.detect-libs.outputs.support_install }}
        assert-install: ${{ steps.detect-libs.outputs.assert_install }}
        detik-install: ${{ steps.detect-libs.outputs.detik_install }}
        file-install: ${{ steps.detect-libs.outputs.file_install }}
    - name: Run bats --recursive ${{ inputs.scan-path }}
      shell: bash
      # Point bats_load_library at /usr/lib so a suite resolves the helper
      # libraries whether they were pre-installed on the runner or installed
      # by bats-action (both land under /usr/lib/bats-*). Prepended, not
      # replaced, so any path a caller already exported still applies.
      run: |
        export BATS_LIB_PATH="/usr/lib${BATS_LIB_PATH:+:${BATS_LIB_PATH}}"
        bats --recursive '${{ inputs.scan-path }}'
