name: Publish download badges
description: >
  Counts release downloads of only the assets whose name matches a regex,
  and publishes the figures as shields endpoint files on a branch of the same
  repository. Shields' own downloads badge also counts files that clients
  poll, such as update manifests. Writes downloads.json, every non-draft
  release summed, and shows the counts per release and locale on the run's
  page. Given a Nexus Mods page, it also counts the project's files there,
  each added to the release whose tag equals the file's version, and shows
  Nexus' own counts on the run's page under a heading of their own. On a
  failed lookup, no match, a Nexus version matching no release, or a run
  that would withdraw a published file, it fails and the branch keeps its
  last good figures. The step log shows each stage in a group of its own,
  with what it read, decided and wrote. The calling job needs
  'permissions: contents: write'.

inputs:
  asset-name-regex:
    description: >
      Which release assets count, as a regex over the whole asset name in
      jq's (Oniguruma) syntax. jq matches anywhere in the name, so anchor it.
      A named group 'locale', such as (?<locale>[a-z-]+), gives the asset's
      locale.
    required: true
  default-locale:
    description: >
      Locale of a counted asset whose name holds none. Without it, such an
      asset counts under no locale when no counted asset names one, as in a
      project keeping no locales. When another counted asset does name one,
      it fails the run, naming the asset.
    required: false
    default: ''
  label:
    description: Label every badge leads with, such as the project's name.
    required: true
  nexus-mod-id:
    description: >
      Id of the Nexus Mods page whose files also count. Empty, Nexus is not
      read. Set, nexus-game-id and nexus-file-name are required, and every
      counted file's version must equal a release's tag, or the run fails.
    required: false
    default: ''
  nexus-game-id:
    description: >
      Nexus Mods' id of the game the page is for. Read only with
      nexus-mod-id.
    required: false
    default: ''
  nexus-file-name:
    description: >
      Name a counted file carries on the Nexus page. A page can host files of
      several projects, each named after its own. Read only with nexus-mod-id.
    required: false
    default: ''
  nexus-locale:
    description: >
      Locale the Nexus files count under. Empty, they count under no locale,
      as a project keeping no locales does. Read only with nexus-mod-id.
    required: false
    default: ''
  branch:
    description: >
      Branch the endpoint files are published to. The action owns it: each
      run that changes a figure replaces the branch with one parentless
      commit, force-pushed. Never point it at a branch holding anything else.
    required: false
    default: badges
  token:
    description: >
      Token that lists the releases and pushes the branch. Defaults to the
      workflow's GITHUB_TOKEN, which needs 'permissions: contents: write'.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Publish download badges
      shell: bash
      # Inputs reach the script through env rather than being spliced into
      # run:, so a regex or label holding shell syntax stays data.
      # COMMON_AUTOMATION_REPO_ROOT lets the stages find .github/lib, three
      # levels above this action.
      env:
        COMMON_AUTOMATION_REPO_ROOT: ${{ github.action_path }}/../../..
        ASSET_NAME_REGEX: ${{ inputs.asset-name-regex }}
        DEFAULT_LOCALE: ${{ inputs.default-locale }}
        BADGE_LABEL: ${{ inputs.label }}
        NEXUS_MOD_ID: ${{ inputs.nexus-mod-id }}
        NEXUS_GAME_ID: ${{ inputs.nexus-game-id }}
        NEXUS_FILE_NAME: ${{ inputs.nexus-file-name }}
        NEXUS_LOCALE: ${{ inputs.nexus-locale }}
        BADGE_BRANCH: ${{ inputs.branch }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        "${{ github.action_path }}/publish-download-badges.sh"
